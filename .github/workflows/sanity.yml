name: Sanity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Parse only; the scripts change real macOS state. Non-fatal until
      # main has a green baseline.
      - name: Syntax-check every shell script (bash -n)
        continue-on-error: true
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done < <(git ls-files -z '*.sh')
          exit "$fail"
